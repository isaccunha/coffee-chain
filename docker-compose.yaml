version: '3.8'

services:
  #
  # gateway
  #

  gateway:
    build: ./gateway
    container_name: coffeechain-gateway
    ports:
      - "5002:5002"
    environment:
      - AUTH_API_URL=http://localhost:3333
      - BLOCKCHAIN_API_URL=http://blockchain:5000
      - SUMMARY_API_URL=http://summary-ai:5000
      - API_GATEWAY_PORT=5002
      - API_GATEWAY_HOST=0.0.0.0
      - FLASK_ENV=production
      - FLASK_DEBUG=False
    depends_on:
      # - auth-ms
      - blockchain
      - summary-ai
    restart: unless-stopped

  #
  # blockchain
  #

  blockchain:
    build: ./blockchain
    container_name: coffeechain-blockchain
    ports:
      - "5001:5000"
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
    volumes:
      - blockchain_data:/app/data
    restart: unless-stopped

  #
  # frontend
  #

  frontend:
    build: ./frontend
    container_name: coffeechain-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - summary-ai

  #
  # auth
  #

  # auth-ms:
  # TODO

  # postgres:
  # TODO

  #
  # summary-ai
  #
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-summarizer
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 4g
    restart: unless-stopped

  ollama-init:
    image: curlimages/curl:latest
    container_name: ollama-init
    entrypoint: sh -c 'curl -X POST http://ollama:11434/api/pull -d "{\"name\":\"llama3.2:1b\"}" && echo "Model llama3.2:1b loaded"'
    restart: on-failure

  summary-ai:
    build: ./summary-ai
    container_name: summary-ai
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama_data:
  postgres_data:
  blockchain_data: