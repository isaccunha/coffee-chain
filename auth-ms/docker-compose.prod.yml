services:
  auth-api:
    image: auth-api:latest
    container_name: auth-api
    build:
      context: .
      dockerfile: .Dockerfile
    depends_on:
      - auth-db
    environment:
      DATABASE_URL: 'postgresql://docker:docker@localhost:5432/users?schema=public'
      API_PORT: '3333'
      JWT_PRIVATE_KEY: ''
      JWT_PUBLIC_KEY: ''
    ports:
      - '3333:3333'
    networks:
      - auth-net
      - ms-net

  auth-db:
    image: bitnami/postgresql:latest
    container_name: auth-db
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: users
      PGDATA: /data/postgres
    volumes:
      - ./data:/data/postgres
    networks:
      - auth-net

networks:
  # Rede privada
  auth-net:
    name: auth-net
    driver: bridge

  # Rede pública
  ms-net:
    external: true
